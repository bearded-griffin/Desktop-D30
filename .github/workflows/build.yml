name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libbluetooth-dev \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            mingw-w64 \
            wget \
            file

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python Tools
        run: |
          python -m pip install --upgrade pip
          pip install invoke

      - name: Run Unit Tests
        run: inv test

      - name: Build Linux AppImage
        run: inv appimage

      - name: Cross-Compile Windows Binary
        run: inv cross-windows

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-D30-Linux
          path: Desktop-D30-x86_64.AppImage
          if-no-files-found: error

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-D30-Windows
          path: build_win_cross/Desktop-D30.exe
          if-no-files-found: error
